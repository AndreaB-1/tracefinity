name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/tracefinity/tracefinity.git

      - name: Fetch upstream
        run: git fetch upstream --tags

      - name: Record tags before sync
        id: before
        run: echo "tags=$(git tag | sort | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Merge upstream main (fast-forward only)
        run: |
          git checkout main
          git merge --ff-only upstream/main

      - name: Push main and tags
        run: |
          git push origin main
          git push origin --tags

      - name: Find new tags
        id: newtags
        run: |
          before="${{ steps.before.outputs.tags }}"
          after=$(git tag | sort | tr '\n' ' ')
          new=""
          for t in $after; do
            if ! echo "$before" | grep -qw "$t"; then
              new="$t"
            fi
          done
          # use the last (highest sort order) new tag, or latest tag if none new
          if [ -z "$new" ]; then
            new=$(git tag | sort -V | tail -1)
          fi
          echo "tag=$new" >> "$GITHUB_OUTPUT"

      - name: Dispatch build workflow
        if: steps.newtags.outputs.tag != ''
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-multiarch.yml/dispatches" \
            -d "{\"ref\":\"refs/tags/${{ steps.newtags.outputs.tag }}\"}"
